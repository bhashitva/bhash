[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bhash-jupyter"
version = "0.1.0"
description = "Bhash language kernel for Jupyter"
requires-python = ">=3.8"
dependencies = ["ipykernel>=5.1", "jupyter-client>=6"]

[project.scripts]
bhash-jupyter-install = "bhash_jupyter.install:main"
