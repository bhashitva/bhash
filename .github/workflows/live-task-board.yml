name: Live task board over TLS
on:
  pull_request:
    paths: &board-paths
      - 'examples/live-task-board/**'
      - '.github/workflows/live-task-board.yml'
      - 'src/main/resources/dev/bhash/stdlib/websocket.bhash'
      - 'src/main/resources/dev/bhash/stdlib/async-web.bhash'
      - 'src/main/resources/dev/bhash/stdlib/authentication.bhash'
      - 'src/main/resources/dev/bhash/stdlib/async-database.bhash'
      - '!**/*.md'
  push:
    branches: [main]
    paths: *board-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-task-board-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: jvm, provider: sqlite}
          - {target: clr, provider: sqlite}
          - {target: native, provider: sqlite}
          - {target: jvm, provider: postgresql}
    services:
      postgres:
        image: ${{ matrix.provider == 'postgresql' && 'postgres:17' || '' }}
        env:
          POSTGRES_DB: bhash_board
          POSTGRES_USER: bhash
          POSTGRES_PASSWORD: ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bhash -d bhash_board"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-dotnet@v5
        if: matrix.target == 'clr'
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the test certificate tools and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl libnss3-tools
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
      - name: Install the native toolchain
        if: matrix.target == 'native'
        run: sudo apt-get install -y clang-18 llvm-18 build-essential binutils libpq5
      - name: Build the compiler
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Verify independent browser sessions over HTTPS and WSS
        env:
          TARGET: ${{ matrix.target }}
          BHASH_BOARD_TEST_PROVIDER: ${{ matrix.provider }}
          BHASH_GC_STRESS: ${{ matrix.target == 'native' && '1' || '0' }}
          BHASH_PG_HOST: 127.0.0.1
          BHASH_PG_DATABASE: bhash_board
          BHASH_PG_USER: bhash
          BHASH_PG_PASSWORD: ci-test-only
          BHASH_PG_SSLMODE: disable
        run: |
          set -euo pipefail
          compiler=target/bhash-compiler-0.1.0-SNAPSHOT.jar
          case "$TARGET" in
            jvm) output=target/live-task-board.jar ;;
            clr) output=target/live-task-board-clr ;;
            native) output=target/live-task-board ;;
          esac
          java -jar "$compiler" compile examples/live-task-board/bhash.project --target "$TARGET" -o "$output"
          case "$TARGET" in
            jvm) command=(java -Dfile.encoding=UTF-8 -jar "$output") ;;
            clr) command=(dotnet "$output/BhashProgram.dll") ;;
            native) command=("$output") ;;
          esac
          python examples/live-task-board/verify.py "${command[@]}"
