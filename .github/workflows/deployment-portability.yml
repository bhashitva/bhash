name: Linux web deployment portability
on:
  pull_request:
    paths: &deployment-paths
      - 'examples/live-task-board/**'
      - 'examples/live-task-board-models/**'
      - 'src/main/**'
      - 'pom.xml'
      - '.github/workflows/deployment-portability.yml'
      - '!**/*.md'
  push:
    branches: [main]
    paths: *deployment-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proxies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Linux toolchain, proxies and browser
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 build-essential binutils libpq5 openssl libnss3-tools
          sudo apt-get install -y caddy
          sudo systemctl stop caddy
          sudo apt-get install -y nginx-light
          sudo systemctl stop nginx
          sudo apt-get install -y apache2
          sudo systemctl stop apache2
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
      - name: Compile the Linux task board once
        run: |
          mvn --batch-mode --no-transfer-progress -DskipTests package
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar compile \
            examples/live-task-board/bhash.project --target native -o target/live-task-board
      - name: Run the same native executable behind Caddy, Nginx and Apache
        run: python examples/live-task-board/verify_deployment.py target/live-task-board
