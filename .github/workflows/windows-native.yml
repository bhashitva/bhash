name: Windows x64 native SDK and compiler
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: windows-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows-native:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      BHASH_REQUIRE_NATIVE: 'true'
      BHASH_REQUIRE_CLR: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      BHASH_NATIVE_TOOLCHAIN: managed
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler and extension
        shell: pwsh
        run: |
          mvn --batch-mode --no-transfer-progress package -DskipTests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix editors/vscode --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build --prefix editors/vscode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test --prefix editors/vscode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build pinned relocatable SDK twice
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-x86_64.zip' -OutFile upstream.zip
          python scripts/build_windows_toolchain.py upstream.zip target/windows-sdk
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/build_windows_toolchain.py upstream.zip target/windows-sdk-again
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $first=(Get-FileHash target/windows-sdk/*.zip).Hash
          $second=(Get-FileHash target/windows-sdk-again/*.zip).Hash
          if ($first -ne $second -or $first -ne 'b0d5934ea134e500ff598f737c40b3076400e85e5760a22bfcc28f7aaf321f3f') { throw 'SDK reproducibility/catalog checksum mismatch' }
          "BHASH_TOOLCHAIN_HOME=$env:RUNNER_TEMP\bhash-toolchains" >> $env:GITHUB_ENV
      - name: Install and validate managed Windows SDK
        shell: pwsh
        run: |
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar native toolchain install --archive target/windows-sdk/bhash-windows-x86_64-llvm18-v1.zip --sha256 b0d5934ea134e500ff598f737c40b3076400e85e5760a22bfcc28f7aaf321f3f --json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar native doctor --json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $active=Get-Content "$env:BHASH_TOOLCHAIN_HOME/active.json" | ConvertFrom-Json
          $sdk=Join-Path "$env:BHASH_TOOLCHAIN_HOME/installations" $active.directory
          "BHASH_CLANG=$sdk/bin/clang.exe" >> $env:GITHUB_ENV
      - name: Runtime, cross-target and forced-GC validation
        shell: pwsh
        run: |
          python scripts/test_native_runtime.py --cc "$env:BHASH_CLANG"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test_native_fixed.py --cc "$env:BHASH_CLANG"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # BHASH_CLANG is only used by the standalone C tests; managed compiler selects its own tools.
          Remove-Item Env:BHASH_CLANG
          mvn --batch-mode --no-transfer-progress '-Dtest=NativeBackendTest,NativeReleaseTest,ManagedToolchainTest,Utf8ArgumentsTest' test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/build_examples.py --target native --require-native
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package Windows-ready VSIX
        run: npm run package --prefix editors/vscode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bhash-windows-native
          path: |
            target/windows-sdk/*.zip
            target/windows-sdk/*.sha256
            target/bhash-vscode-0.6.0.vsix
            target/surefire-reports/
            target/examples/build-report.json
            target/examples/logs/
          if-no-files-found: error
  windows-clean:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Build compiler and shipped Windows launcher
        shell: pwsh
        run: |
          mvn --batch-mode --no-transfer-progress package -DskipTests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix editors/vscode --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build --prefix editors/vscode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify clean Windows build/run and offline reuse
        shell: pwsh
        run: |
          # Server Core has no WSL, Visual Studio, LLVM or C development SDK.
          New-Item -ItemType Directory target/clean-node -Force | Out-Null
          Copy-Item (Get-Command node.exe).Source target/clean-node/node.exe
          docker pull mcr.microsoft.com/windows/servercore:ltsc2022
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          docker volume create bhash-windows-cache
          docker volume create bhash-windows-programs
          $mounts=@('-v',"${PWD}:C:\repo:ro",'-v',"$env:JAVA_HOME`:C:\java:ro",'-v','bhash-windows-cache:C:\cache','-v','bhash-windows-programs:C:\programs')
          $settings=@('-e','BHASH_TEST_DEPLOY_DIR=C:\programs','-e','BHASH_TOOLCHAIN_HOME=C:\cache','-e','BHASH_NATIVE_TOOLCHAIN=managed')
          Write-Host "Testing automatic installation from the permanent GitHub SDK release"
          docker run --rm @mounts @settings mcr.microsoft.com/windows/servercore:ltsc2022 C:\repo\target\clean-node\node.exe C:\repo\editors\vscode\test\native-windows-clean.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          docker run --rm --network none @mounts @settings mcr.microsoft.com/windows/servercore:ltsc2022 C:\repo\target\clean-node\node.exe C:\repo\editors\vscode\test\native-windows-clean.cjs --offline
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run application without Java, .NET, Node or SDK mounted
        shell: pwsh
        run: |
          docker run --rm --network none -v bhash-windows-programs:C:\app:ro mcr.microsoft.com/windows/servercore:ltsc2022 powershell.exe -NoProfile -Command 'foreach($tool in @("java","dotnet","node","clang","gcc","wsl")){if(Get-Command $tool -ErrorAction SilentlyContinue){throw "Unexpected tool: $tool"}}; & C:\app\hello.exe; if($LASTEXITCODE){exit $LASTEXITCODE}'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
