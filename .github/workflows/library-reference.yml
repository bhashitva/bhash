name: Hindi standard library reference

on:
  pull_request:
    paths: &reference-paths
      - '.github/workflows/library-reference.yml'
      - 'scripts/build_library_reference.py'
      - 'scripts/StandardLibraryApi.java'
      - 'src/main/resources/dev/bhash/stdlib/**'
      - 'src/main/java/dev/bhash/stdlib/**'
      - 'src/main/java/dev/bhash/frontend/**'
      - 'src/main/java/dev/bhash/backend/ManagedEmitter.java'
      - 'src/main/antlr4/Bhash.g4'
      - 'tutorial/**'
      - 'examples/**/*.bhash'
      - 'book/**/*.bhash'
      - 'src/test/resources/**/*.bhash'
      - 'docs/**'
      - 'pom.xml'
  push:
    branches: [main]
    paths: *reference-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build the compiler for API inspection
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Check public API coverage and run the reference examples
        run: python scripts/build_library_reference.py --check --test-examples jvm
