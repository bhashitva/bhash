name: SQL Server provider
on:
  pull_request:
    paths:
      - 'src/main/**'
      - 'src/test/resources/sqlserver/**'
      - 'scripts/generate_orm.py'
      - 'pom.xml'
      - '.github/workflows/sqlserver.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jdbc:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'BhashCi-Only2026!'
        ports: ['1433:1433']
        options: >-
          --health-cmd 'SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -b -Q "SELECT 1"'
          --health-interval 5s --health-timeout 5s --health-retries 24
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Bhash and fetch the JDBC driver
        run: |
          mvn --batch-mode --no-transfer-progress -DskipTests package
          mvn --batch-mode --no-transfer-progress dependency:copy -Dartifact=com.microsoft.sqlserver:mssql-jdbc:12.10.2.jre11 -DoutputDirectory=target/sqlserver-driver
      - name: Run JDBC queries and the generated ORM against SQL Server 2022
        env:
          SQLSERVER_CONTAINER: ${{ job.services.sqlserver.id }}
          SQLCMDPASSWORD: 'BhashCi-Only2026!'
        run: |
          docker exec -i -e SQLCMDPASSWORD "$SQLSERVER_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -b < src/test/resources/sqlserver/schema.sql
          cp -r src/test/resources/sqlserver target/sqlserver-integration
          python scripts/generate_orm.py target/sqlserver-integration/mapping.json --output target/sqlserver-integration/src/generated.bhash
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar deps lock target/sqlserver-integration
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar compile target/sqlserver-integration --target jvm -o target/sqlserver-integration.jar
          export BHASH_SQLSERVER_URL="jdbc:sqlserver://127.0.0.1:1433;databaseName=bhash;user=sa;password=$SQLCMDPASSWORD;encrypt=true;trustServerCertificate=true"
          result=$(java -cp 'target/sqlserver-integration.jar:target/sqlserver-driver/*' BhashProgram)
          printf '%s\n' "$result"
          grep -Fx SQLSERVER_ORM_OK <<<"$result"
