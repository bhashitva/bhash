name: SQL Server provider
on:
  pull_request:
    paths:
      - 'src/main/**'
      - 'src/test/resources/sqlserver/**'
      - 'scripts/generate_orm.py'
      - 'pom.xml'
      - '.github/workflows/sqlserver.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sqlserver-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    name: SQL Server 2022 (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [jvm, clr, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'BhashCi-Only2026!'
        ports: ['1433:1433']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Bhash
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Fetch the JDBC driver
        if: matrix.target == 'jvm'
        run: mvn --batch-mode --no-transfer-progress dependency:copy -Dartifact=com.microsoft.sqlserver:mssql-jdbc:12.10.2.jre11 -DoutputDirectory=target/sqlserver-driver
      - uses: actions/setup-dotnet@v5
        if: matrix.target == 'clr'
        with:
          dotnet-version: '10.0.x'
      - name: Publish the SqlClient driver and dependencies
        if: matrix.target == 'clr'
        run: |
          dotnet new console --framework net10.0 --output target/sqlserver-driver-project
          dotnet add target/sqlserver-driver-project package Microsoft.Data.SqlClient --version 6.1.7
          dotnet publish target/sqlserver-driver-project -r linux-x64 --self-contained false -o "$PWD/target/sqlserver-driver"
      - name: Install LLVM and Microsoft ODBC Driver 18
        if: matrix.target == 'native'
        run: |
          curl -fsSLo /tmp/microsoft-prod.deb https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
          sudo dpkg -i /tmp/microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y clang-18 llvm-18 unixodbc msodbcsql18
          odbcinst -q -d -n 'ODBC Driver 18 for SQL Server'
      - name: Run parameterized queries and the generated ORM against SQL Server 2022
        env:
          SQLSERVER_CONTAINER: ${{ job.services.sqlserver.id }}
          TARGET: ${{ matrix.target }}
          SQLCMDPASSWORD: 'BhashCi-Only2026!'
        run: |
          sqlcmd=(docker exec -e SQLCMDPASSWORD "$SQLSERVER_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -b)
          for attempt in {1..24}; do
            if "${sqlcmd[@]}" -Q 'SELECT 1' >/dev/null 2>&1; then break; fi
            if [[ "$attempt" == 24 ]]; then docker logs "$SQLSERVER_CONTAINER"; exit 1; fi
            sleep 3
          done
          docker cp src/test/resources/sqlserver/schema.sql "$SQLSERVER_CONTAINER:/tmp/bhash-schema.sql"
          "${sqlcmd[@]}" -i /tmp/bhash-schema.sql
          "${sqlcmd[@]}" -d bhash -Q "IF OBJECT_ID(N'dbo.gradelevel', N'U') IS NULL OR OBJECT_ID(N'dbo.student', N'U') IS NULL THROW 50000, 'Fixture tables missing in a new session.', 1;"
          cp -r src/test/resources/sqlserver target/sqlserver-integration
          python scripts/generate_orm.py target/sqlserver-integration/mapping.json --output target/sqlserver-integration/src/generated.bhash
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar deps lock target/sqlserver-integration
          compiler=target/bhash-compiler-0.1.0-SNAPSHOT.jar
          input=target/sqlserver-integration
          case "$TARGET" in
            jvm)
              export BHASH_SQLSERVER_URL="jdbc:sqlserver://127.0.0.1:1433;databaseName=bhash;user=sa;password=$SQLCMDPASSWORD;encrypt=true;trustServerCertificate=true"
              java -jar "$compiler" compile "$input" --target jvm -o target/sqlserver-integration.jar
              java -cp 'target/sqlserver-integration.jar:target/sqlserver-driver/*' BhashProgram
              ;;
            clr)
              export BHASH_SQLSERVER_URL="Server=tcp:127.0.0.1,1433;Database=bhash;User ID=sa;Password=$SQLCMDPASSWORD;Encrypt=true;TrustServerCertificate=true"
              export BHASH_SQLSERVER_DOTNET_DRIVER="$PWD/target/sqlserver-driver/Microsoft.Data.SqlClient.dll"
              java -jar "$compiler" compile "$input" --target clr -o target/sqlserver-clr
              dotnet target/sqlserver-clr/BhashProgram.dll
              ;;
            native)
              export BHASH_SQLSERVER_URL="Driver={ODBC Driver 18 for SQL Server};Server=tcp:127.0.0.1,1433;Database=bhash;UID=sa;PWD=$SQLCMDPASSWORD;Encrypt=yes;TrustServerCertificate=yes"
              java -jar "$compiler" compile "$input" --target native -o target/sqlserver-native
              BHASH_GC_STRESS=1 target/sqlserver-native
              ;;
          esac | tee target/sqlserver-output.txt
          grep -Fx SQLSERVER_SYNC_OK target/sqlserver-output.txt
          grep -Fx SQLSERVER_ORM_OK target/sqlserver-output.txt
  windows-native:
    name: SQL Server 2022 (native Windows x64)
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      BHASH_NATIVE_TOOLCHAIN: managed
      BHASH_GC_STRESS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start SQL Server 2022 Express LocalDB and load the fixture
        shell: powershell
        run: |
          function Install-MicrosoftMsi($Url, $Name, $Properties) {
            $file = Join-Path $env:RUNNER_TEMP $Name
            Invoke-WebRequest -UseBasicParsing $Url -OutFile $file
            $signature = Get-AuthenticodeSignature -FilePath $file
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Microsoft Corporation(?:,|$)') {
              throw "Invalid Microsoft signature for $Name"
            }
            $installer = Start-Process msiexec.exe -ArgumentList "/i ""$file"" /qn /norestart $Properties" -Wait -PassThru -WindowStyle Hidden
            if ($installer.ExitCode -notin 0,3010) { throw "Install $Name failed with exit code $($installer.ExitCode)" }
          }
          $driver = 'ODBC Driver 18 for SQL Server'
          if (-not (Get-OdbcDriver -Name $driver -Platform '64-bit' -ErrorAction SilentlyContinue)) {
            Install-MicrosoftMsi 'https://go.microsoft.com/fwlink/?linkid=2378279' 'msodbcsql.msi' 'IACCEPTMSODBCSQLLICENSETERMS=YES'
          }
          $key = 'HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server Local DB\Installed Versions\16.0'
          if (-not (Test-Path $key)) {
            Install-MicrosoftMsi 'https://download.microsoft.com/download/3/8/d/38de7036-2433-4207-8eae-06e247e17b25/SqlLocalDB.msi' 'SqlLocalDB.msi' 'IACCEPTSQLLOCALDBLICENSETERMS=YES'
          }
          $localDb = Get-Command SqlLocalDB.exe -ErrorAction SilentlyContinue
          if ($localDb) { $localDb = $localDb.Source }
          else { $localDb = Join-Path $env:ProgramFiles 'Microsoft SQL Server\160\Tools\Binn\SqlLocalDB.exe' }
          & $localDb create BhashSqlServer 16.0 -s
          if ($LASTEXITCODE) { throw 'Could not start SQL Server 2022 LocalDB' }

          $connectionString = "Driver={$driver};Server=(localdb)\BhashSqlServer;Trusted_Connection=yes;Encrypt=optional"
          $connection = [System.Data.Odbc.OdbcConnection]::new("$connectionString;Database=master")
          try {
            $connection.Open()
            $command = $connection.CreateCommand()
            try {
              $command.CommandText = "SELECT CONVERT(int, SERVERPROPERTY('ProductMajorVersion'))"
              if ([int]$command.ExecuteScalar() -ne 16) { throw 'Expected a SQL Server 2022 engine (major version 16)' }
              $schema = Get-Content src/test/resources/sqlserver/schema.sql -Raw
              foreach ($batch in ($schema -split '(?im)^GO[ \t]*\r?$')) {
                if ($batch.Trim()) {
                  $command.CommandText = $batch
                  $null = $command.ExecuteNonQuery()
                }
              }
            } finally { $command.Dispose() }
          } finally { $connection.Dispose() }
          "BHASH_SQLSERVER_URL=$connectionString;Database=bhash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Bhash and install the managed Windows SDK
        shell: pwsh
        run: |
          mvn --batch-mode --no-transfer-progress -DskipTests package
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar native toolchain install --url https://github.com/bhashitva/bhash/releases/download/native-sdk-windows-1.0.0/bhash-windows-x86_64-llvm18-v1.zip --sha256 b0d5934ea134e500ff598f737c40b3076400e85e5760a22bfcc28f7aaf321f3f
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run parameterized queries, ORM, and rollback with forced GC
        shell: pwsh
        run: |
          Copy-Item src/test/resources/sqlserver target/sqlserver-integration -Recurse
          python scripts/generate_orm.py target/sqlserver-integration/mapping.json --output target/sqlserver-integration/src/generated.bhash
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $compiler = 'target/bhash-compiler-0.1.0-SNAPSHOT.jar'
          java -jar $compiler deps lock target/sqlserver-integration
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          java -jar $compiler compile target/sqlserver-integration --target native -o target/sqlserver-integration.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $output = & ./target/sqlserver-integration.exe
          $exitCode = $LASTEXITCODE
          $output | Write-Output
          if ($exitCode -ne 0 -or $output -cnotcontains 'SQLSERVER_SYNC_OK' -or $output -cnotcontains 'SQLSERVER_ORM_OK') {
            throw 'Native Windows SQL Server integration failed'
          }
