name: macOS Apple Silicon native compiler
on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-macos-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  macos-sdk:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - uses: actions/cache@v4
        id: sdk-cache
        with:
          path: target/macos-sdk
          key: macos-sdk-reproduced-${{ hashFiles('scripts/build_macos_native_toolchain.py', 'scripts/build_native_toolchain.py') }}
      - uses: actions/cache@v4
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        with:
          path: llvm-upstream.tar.xz
          key: macos-llvm-18.1.8-4573b7f25f46d2a9
      - name: Authenticate upstream and reproduce the managed LLVM SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          test "$(uname -m)" = arm64
          if [ ! -f llvm-upstream.tar.xz ]; then
            curl --fail --location --retry 3 'https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-arm64-apple-macos11.tar.xz' -o llvm-upstream.tar.xz
          fi
          python3 scripts/build_macos_native_toolchain.py llvm-upstream.tar.xz
          python3 scripts/build_macos_native_toolchain.py llvm-upstream.tar.xz --output target/macos-sdk-again
          cmp target/macos-sdk/bhash-macos-arm64-llvm18-v1.zip target/macos-sdk-again/bhash-macos-arm64-llvm18-v1.zip
      - name: Verify the immutable SDK catalog hash, including cached archives
        run: |
          cd target/macos-sdk
          echo 'c92917d04e8514ed497173326fafa138ba1b9767ac17a0f88b568d6b6ee3e22d  bhash-macos-arm64-llvm18-v1.zip' | shasum -a 256 -c -
      - uses: actions/upload-artifact@v4
        with:
          name: bhash-macos-sdk
          path: target/macos-sdk/*
          if-no-files-found: error
  macos-native:
    needs: macos-sdk
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      BHASH_NATIVE_TOOLCHAIN: managed
      BHASH_REQUIRE_NATIVE: 'true'
      BHASH_REQUIRE_CLR: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      # LeakSanitizer is unavailable on Darwin. Precise collector live-count tests remain mandatory.
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - uses: actions/download-artifact@v4
        with:
          name: bhash-macos-sdk
          path: target/macos-sdk
      - name: Build compiler and activate the authenticated local SDK
        id: setup
        run: |
          test "$(uname -m)" = arm64
          mvn --batch-mode --no-transfer-progress -DskipTests package
          export BHASH_TOOLCHAIN_HOME="$RUNNER_TEMP/Bhash SDK भारत"
          echo "BHASH_TOOLCHAIN_HOME=$BHASH_TOOLCHAIN_HOME" >> "$GITHUB_ENV"
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar native toolchain install --archive target/macos-sdk/bhash-macos-arm64-llvm18-v1.zip --sha256 c92917d04e8514ed497173326fafa138ba1b9767ac17a0f88b568d6b6ee3e22d --json
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar native toolchain verify --json
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar native doctor --json
          python3 - <<'PYTHON'
          import json, os, pathlib
          cache=pathlib.Path(os.environ['BHASH_TOOLCHAIN_HOME'])
          active=json.loads((cache/'active.json').read_text())
          with open(os.environ['GITHUB_PATH'],'a') as out:
              out.write(str(cache/'installations'/active['directory']/'bin')+'\n')
          PYTHON
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Verify generated ORM on SQLite with forced GC
        run: python3 examples/orm/verify.py --target native
      - name: Validate native SQL Server 2022 with forced GC
        env:
          BHASH_GC_STRESS: '1'
          BHASH_CI_MACOS_VERSION: ${{ matrix.os }}
          SQLCMDSERVER: ${{ secrets.MACOS_SQLSERVER_HOST }}
          SQLCMDUSER: ${{ secrets.MACOS_SQLSERVER_USER }}
          SQLCMDPASSWORD: ${{ secrets.MACOS_SQLSERVER_PASSWORD }}
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew tap microsoft/mssql-release https://github.com/microsoft/homebrew-mssql-release
          if brew command trust >/dev/null 2>&1; then brew trust microsoft/mssql-release; fi
          HOMEBREW_ACCEPT_EULA=Y brew install microsoft/mssql-release/msodbcsql18
          odbc="$(brew --prefix unixodbc)"
          export BHASH_UNIXODBC="$odbc/lib/libodbc.2.dylib"
          "$odbc/bin/odbcinst" -q -d -n 'ODBC Driver 18 for SQL Server'

          input=target/macos-sqlserver-integration
          cp -R src/test/resources/sqlserver "$input"
          python3 scripts/generate_orm.py "$input/mapping.json" --output "$input/src/generated.bhash"
          compiler=target/bhash-compiler-0.1.0-SNAPSHOT.jar
          java -jar "$compiler" deps lock "$input"
          java -jar "$compiler" compile "$input" --target native -o target/macos-sqlserver
          file target/macos-sqlserver | grep -F arm64

          if [[ -z "$SQLCMDSERVER" && -z "$SQLCMDUSER" && -z "$SQLCMDPASSWORD" ]]; then
            export BHASH_SQLSERVER_URL='Driver={ODBC Driver 18 for SQL Server};Server=tcp:127.0.0.1,1;Encrypt=yes;LoginTimeout=2'
            if target/macos-sqlserver >target/macos-sqlserver-no-endpoint.log 2>&1; then
              echo 'Unexpected successful connection to an unused loopback port' >&2
              exit 1
            fi
            grep -F 'SQL Server संबंध नहीं खुला।' target/macos-sqlserver-no-endpoint.log
            echo '::notice::Live SQL Server test requires the MACOS_SQLSERVER_* secrets. The arm64 build and ODBC loader were checked.'
            exit 0
          fi
          : "${SQLCMDSERVER:?Set MACOS_SQLSERVER_HOST}" "${SQLCMDUSER:?Set MACOS_SQLSERVER_USER}" "${SQLCMDPASSWORD:?Set MACOS_SQLSERVER_PASSWORD}"
          HOMEBREW_ACCEPT_EULA=Y brew install microsoft/mssql-release/mssql-tools18
          sqlcmd=("$(brew --prefix mssql-tools18)/bin/sqlcmd" -b -l 15 -d master)
          "${sqlcmd[@]}" -Q "IF CONVERT(int, SERVERPROPERTY('ProductMajorVersion')) <> 16 THROW 50000, 'Expected SQL Server 2022', 1;"
          db="bhash_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${BHASH_CI_MACOS_VERSION//[^0-9]/}"
          [[ "$db" =~ ^bhash_ci_[0-9]+_[0-9]+_[0-9]+$ ]]
          "${sqlcmd[@]}" -Q "CREATE DATABASE [$db]"
          cleanup() {
            status=$?
            "${sqlcmd[@]}" -Q "DROP DATABASE [$db]" || status=1
            exit "$status"
          }
          trap cleanup EXIT
          sed -e '1,2d' -e "s/^USE bhash;$/USE [$db];/" "$input/schema.sql" | "${sqlcmd[@]}"
          for value in "$SQLCMDSERVER" "$SQLCMDUSER" "$SQLCMDPASSWORD"; do
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo 'A SQL Server connection setting contains a line break' >&2
              exit 1
            fi
          done
          export BHASH_SQLSERVER_TEST_DATABASE="$db"
          export BHASH_SQLSERVER_URL="Driver={ODBC Driver 18 for SQL Server};Server={${SQLCMDSERVER//\}/\}\}}};Database=$db;UID={${SQLCMDUSER//\}/\}\}}};PWD={${SQLCMDPASSWORD//\}/\}\}}};Encrypt=yes;TrustServerCertificate=no"
          target/macos-sqlserver | tee target/macos-sqlserver.log
          grep -Fx SQLSERVER_SYNC_OK target/macos-sqlserver.log
          grep -Fx SQLSERVER_ORM_OK target/macos-sqlserver.log
      - name: Test native WebSocket wire behavior over HTTP/1.1 and HTTP/2 TLS
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          BHASH_GC_STRESS: '1'
        run: |
          python3 -m pip install -r deploy/http2-websocket/requirements.txt
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar compile examples/websocket/server.bhash --target native -o target/websocket-wire
          python3 examples/websocket/verify.py target/websocket-wire
          python3 examples/websocket/verify_http2.py target/websocket-wire
      - name: Validate collector, binary64 formatting and exception cleanup under sanitizers
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          if [ "${{ matrix.os }}" = macos-26 ]; then
            # LLVM 18's ASan runtime deadlocks before main on macOS 26.4+:
            # https://github.com/llvm/llvm-project/issues/200447
            # Exercise the shipped LLVM uninstrumented, then require the same
            # complete runtime suite under Apple's current compatible sanitizers.
            python3 scripts/test_native_runtime.py
            apple_clang="$(xcrun --find clang)"
            "$apple_clang" --version
            python3 scripts/test_native_runtime.py --cc "$apple_clang" --sanitize
          else
            python3 scripts/test_native_runtime.py --sanitize
          fi
          python3 scripts/test_native_fixed.py
      - name: Verify reproducible release packages, Mach-O inspection, symbols and standalone execution
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 scripts/test_macos_native_release.py
      - name: Check SQLite literal and heap text boundaries under forced GC and sanitizers
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: mvn --batch-mode --no-transfer-progress '-Dtest=NativeBackendTest#nativeSqlite*+nativeWeb*+nativeAuthentication*' test
      - name: Cross-validate native language behavior against JVM and CLR with forced GC
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: mvn --batch-mode --no-transfer-progress -Dtest=NativeBackendTest,NativeReleaseTest,ManagedToolchainTest,MacosCompatibilityTest,AuthenticationCoreTest,JvmAuthenticationTest,ClrAuthenticationTest,WebCoreTest,JvmWebTest,ClrWebTest,SqliteCoreTest,SqliteAssetsTest,JvmSqliteTest,ClrSqliteTest test
      - name: Verify standalone SQLite distribution and reproducibility
        run: python3 scripts/test_sqlite_distribution.py
      - name: Test the typed API over HTTP under forced GC
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 examples/typed-api/verify.py --target native
      - name: Compile every applicable native example
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          python3 -m unittest discover -s scripts -p test_build_examples.py
          python3 scripts/build_examples.py --target native --require-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bhash-macos-${{ matrix.os }}-validation
          path: |
            target/surefire-reports/
            target/macos-release/
            target/examples/build-report.json
            target/examples/logs/
          if-no-files-found: warn

