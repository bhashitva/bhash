name: Bhash Android native library and task list
on:
  pull_request:
    paths:
      - '.github/workflows/android-mobile.yml'
      - 'src/main/**'
      - 'pom.xml'
      - 'examples/android-offline-task-list/**'
      - 'tests/native-embedding/**'
      - 'scripts/test_native_embedding.py'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  embedding:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18 binutils
      - run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - run: python3 scripts/test_native_embedding.py

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: system-images;android-29;google_apis;x86_64
      APP: examples/android-offline-task-list
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build and emulator tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'emulator' 'platform-tools' "$IMAGE"
          test -e /dev/kvm
          sudo chown "$USER" /dev/kvm
      - run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Build app and tests for ARM64 and x86-64
        run: bash "$APP/gradlew" -p "$APP" --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Check alignment, ABIs and runtime dependencies
        run: |
          apk="$APP/app/build/outputs/apk/debug/app-debug.apk"
          readelf="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
          temp="$(mktemp -d)"
          for abi in arm64-v8a x86_64; do
            for lib in libbhash_app.so libbhash_jni.so; do
              unzip -p "$apk" "lib/$abi/$lib" > "$temp/$lib"
              "$readelf" --program-headers "$temp/$lib" | awk '/LOAD/ { count++; if ($NF != "0x4000") exit 1 } END { if (!count) exit 1 }'
              "$readelf" --dynamic "$temp/$lib"
              if "$readelf" --dynamic "$temp/$lib" | grep -Ei 'libjvm|libjli|coreclr|hostfxr|mono|libsqlite'; then exit 1; fi
              case "$abi" in
                arm64-v8a) "$readelf" --file-header "$temp/$lib" | grep -q AArch64 ;;
                x86_64) "$readelf" --file-header "$temp/$lib" | grep -q 'X86-64' ;;
              esac
            done
          done
      - name: Run the Hindi task list offline with forced GC and CheckJNI
        run: |
          echo no | avdmanager create avd --force --name bhash-api29 --package "$IMAGE"
          emulator -avd bhash-api29 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          trap 'adb emu kill || true' EXIT
          timeout 240 adb wait-for-device
          timeout 240 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 2; done'
          adb shell settings put global airplane_mode_on 1
          adb shell svc wifi disable
          adb shell svc data disable
          adb shell setprop debug.checkjni 1
          bash "$APP/gradlew" -p "$APP" --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: bhash-offline-tasks-debug
          path: |
            examples/android-offline-task-list/app/build/outputs/apk/debug/app-debug.apk
            examples/android-offline-task-list/app/build/generated/bhash/libraries/*/*.debug
