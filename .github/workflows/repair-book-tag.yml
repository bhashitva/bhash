name: Repair Hindi book 1.2.0 source tag
on:
  push:
    branches: [maintenance/book-hi-1.2.0-tag]
    paths: [.github/workflows/repair-book-tag.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Match the public source tag to the verified book export
        shell: bash
        run: |
          set -euo pipefail
          tag=refs/tags/book-hi-1.2.0
          old=3a534350c43d0780c10a7e1a6556593bac1c0f99
          build=fcd745a12d54fa5e8d7998ded8fe46af1f852969
          current=$(git ls-remote --refs origin "$tag" | cut -f1)
          git merge-base --is-ancestor "$build" HEAD
          if [[ "$current" == "$old" ]]; then
            git push --force-with-lease="$tag:$old" origin "$build:$tag"
          elif [[ "$current" != "$build" ]]; then
            echo "The tag has an unexpected target. No update made." >&2
            exit 1
          fi
          test "$(git ls-remote --refs origin "$tag" | cut -f1)" = "$build"
