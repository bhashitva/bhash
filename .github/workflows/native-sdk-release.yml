name: Publish native SDK assets
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-native-sdk-1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify tested artifact provenance
        run: |
          gh api repos/$GH_REPO/actions/runs/40952800261 > run.json
          python3 - <<'PY'
          import json
          r=json.load(open('run.json'))
          assert r['head_sha']=='b8ea6ae25259ca4b8eed087021285eb04b7ca42e'
          assert r['conclusion']=='success'
          assert r['path']=='.github/workflows/managed-native.yml'
          PY
      - name: Download and verify SDK and corresponding sources
        run: |
          gh run download 40952800261 -n bhash-managed-native-toolchain-linux-x86_64 -D sdk
          cd sdk/managed-toolchain
          echo '52e8a1c7bd1b71082c0c9d7364776a53f5d7a3b8b87d6501f1cf0894ed09e844  bhash-linux-x86_64-llvm18-v1-jammy.zip' | sha256sum -c -
          echo '5b6c13538b4748b21182ec71d2165a1fcac089370efa987f56295d37991d8627  bhash-linux-x86_64-llvm18-v1-jammy-sources.zip' | sha256sum -c -
      - name: Publish immutable versioned download assets
        run: |
          cat > notes.md <<'NOTES'
          Managed Linux x86-64 native SDK for Bhash (LLVM 18.1.8).

          Compiler host: Linux x86-64 with glibc 2.35+ (Ubuntu 22.04+, including WSL) and Java 17+. No separate LLVM, linker, C compiler or development packages are required. Native compilation remains experimental. Generated applications do not require Java or LLVM.

          The sources archive contains corresponding sources for redistributed components; copyright and license notices are included in the SDK. Keep these files available with this release.

          Verified binary SHA-256: `52e8a1c7bd1b71082c0c9d7364776a53f5d7a3b8b87d6501f1cf0894ed09e844`

          Verified sources SHA-256: `5b6c13538b4748b21182ec71d2165a1fcac089370efa987f56295d37991d8627`

          Built and tested by managed-native workflow run 40952800261. This release is a toolchain distribution, not a new compiler version.
          NOTES
          gh release create native-sdk-1.1.0 --draft --target b8ea6ae25259ca4b8eed087021285eb04b7ca42e --title 'Bhash native Linux SDK 1.1.0 (LLVM 18)' --notes-file notes.md
          gh release upload native-sdk-1.1.0 sdk/managed-toolchain/*.zip sdk/managed-toolchain/*.sha256
          gh release edit native-sdk-1.1.0 --draft=false --latest=false
