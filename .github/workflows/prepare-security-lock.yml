name: Prepare minimatch security lockfile
on:
  push:
    branches: [fix/minimatch-security]
    paths: [.github/workflows/prepare-security-lock.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve patched extension dependencies
        working-directory: editors/vscode
        run: |
          node --input-type=commonjs <<'JS'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.version = '0.9.3';
          p.scripts.package = p.scripts.package.replace('0.9.2.vsix', '0.9.3.vsix');
          p.devDependencies['@vscode/vsce'] = '4.1.0';
          p.overrides = {...p.overrides, minimatch: '11.0.1'};
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          JS
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm ls minimatch
          npm audit --json > ../../target-security-audit.json || true
          node --input-type=commonjs <<'JS'
          const assert = require('node:assert/strict');
          const lock = require('./package-lock.json');
          const entries = Object.entries(lock.packages).filter(([key]) => /node_modules\/minimatch$/.test(key));
          assert.ok(entries.length);
          for (const [key, info] of entries) assert.equal(info.version, '11.0.1', key);
          const audit = require('../../target-security-audit.json');
          assert.ok(audit.metadata, 'audit must complete');
          assert.equal(audit.vulnerabilities?.minimatch, undefined);
          const {createRequire} = require('node:module');
          const clientRequire = createRequire(require.resolve('vscode-languageclient/package.json'));
          const {Minimatch} = clientRequire('minimatch');
          assert.ok(new Minimatch('**/*.{bhash,project,lock}', {noext: true}).match('src/भारत😀.bhash'));
          assert.ok(!new Minimatch('**/*.bhash', {noext: true}).match('src/main.java'));
          const matcher = new Minimatch(Array(18).fill('**/..').join('/') + '/x', {optimizationLevel: 2, braceExpandMax: 128});
          assert.ok(matcher.globParts.length <= 128);
          console.log('PASS pinned graph, audit, language-client matcher API and preprocessing budget');
          JS
      - run: mvn --batch-mode --no-transfer-progress package -DskipTests
      - run: npm run build --prefix editors/vscode
      - run: npm test --prefix editors/vscode
      - run: xvfb-run -a npm run test:integration --prefix editors/vscode
      - run: npm run package --prefix editors/vscode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patched-extension-dependencies
          path: |
            editors/vscode/package.json
            editors/vscode/package-lock.json
            target-security-audit.json
            target/bhash-vscode-0.9.3.vsix
          if-no-files-found: error
