name: HTTP/2 WebSocket checks
on:
  pull_request:
    paths: &http2-paths
      - 'deploy/http2-websocket/**'
      - 'examples/websocket/**'
      - 'src/main/resources/dev/bhash/stdlib/websocket.bhash'
      - 'src/main/resources/dev/bhash/stdlib/async-web.bhash'
      - 'src/main/resources/dev/bhash/stdlib/authentication.bhash'
      - '.github/workflows/websocket-http2.yml'
      - '!**/*.md'
  push:
    branches: [main]
    paths: *http2-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: websocket-http2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extended-connect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [jvm, clr, native]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-dotnet@v5
        if: matrix.target == 'clr'
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install gateway dependencies
        run: python -m pip install -r deploy/http2-websocket/requirements.txt
      - name: Install the native toolchain
        if: matrix.target == 'native'
        run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18 build-essential binutils
      - name: Build the compiler
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Verify TLS, Extended CONNECT and stream isolation
        env:
          TARGET: ${{ matrix.target }}
          BHASH_GC_STRESS: ${{ matrix.target == 'native' && '1' || '0' }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            jvm) output=target/http2-echo.jar; command=(java -Dfile.encoding=UTF-8 -jar "$output") ;;
            clr) output=target/http2-echo-clr; command=(dotnet "$output/BhashProgram.dll") ;;
            native) output=target/http2-echo; command=("$output") ;;
          esac
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar compile examples/websocket/server.bhash --target "$TARGET" -o "$output"
          python examples/websocket/verify_http2.py "${command[@]}"
