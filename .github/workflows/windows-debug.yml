name: Windows native debugging
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: windows-debug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  debugger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Build locked GDB/Python distribution and corresponding sources
        run: |
          python3 scripts/build_windows_debugger.py
          python3 scripts/build_windows_debugger.py --output target/windows-debugger-sdk-again
          cmp target/windows-debugger-sdk/bhash-windows-x86_64-gdb-v1.zip target/windows-debugger-sdk-again/bhash-windows-x86_64-gdb-v1.zip
          cmp target/windows-debugger-sdk/bhash-windows-debugger-corresponding-sources.zip target/windows-debugger-sdk-again/bhash-windows-debugger-corresponding-sources.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-debugger-sdk
          compression-level: 0
          path: |
            target/windows-debugger-sdk/bhash-windows-x86_64-gdb-v1.zip
            target/windows-debugger-sdk/*.sha256
            target/windows-debugger-sdk/windows-debugger.json
            scripts/windows-debugger-packages.lock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-debugger-sources
          compression-level: 0
          path: target/windows-debugger-sdk/bhash-windows-debugger-corresponding-sources.zip

  windows:
    needs: debugger
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      BHASH_NATIVE_TOOLCHAIN: managed
      BHASH_TOOLCHAIN_HOME: ${{ github.workspace }}/target/windows-debug-tools
      BHASH_DEBUGGER_HOME: ${{ github.workspace }}/target/debugger हिन्दी
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - uses: actions/download-artifact@v4
        with:
          name: windows-debugger-sdk
          path: target/debugger-artifact
      - name: Validate release catalog and build package
        shell: pwsh
        run: |
          $candidate=Get-Content target/debugger-artifact/target/windows-debugger-sdk/windows-debugger.json | ConvertFrom-Json
          $catalog=Get-Content editors/vscode/src/windows-debugger.json | ConvertFrom-Json
          if ($catalog.sha256 -ne $candidate.sha256) { throw 'Debugger release is not reproducible from the package lock' }
          mvn --batch-mode --no-transfer-progress package -DskipTests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          mvn --batch-mode --no-transfer-progress '-Dtest=ManagedDebuggerTest' test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix editors/vscode --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run package --prefix editors/vscode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test --prefix editors/vscode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Real debugger in Windows Server Core without WSL or development tools
        id: clean
        continue-on-error: true
        shell: pwsh
        run: |
          $service=Get-Service docker
          if ($service.Status -ne 'Running') { Start-Service docker; $service.WaitForStatus('Running',[TimeSpan]::FromSeconds(60)) }
          docker pull mcr.microsoft.com/windows/servercore:ltsc2022
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $node=Split-Path (Get-Command node.exe).Source
          $python=python -c "import sys; print(sys.base_prefix)"
          docker volume create bhash-debug-tools
          docker volume create bhash-debug-gdb
          docker run --rm --workdir C:\repo -v "${PWD}:C:\repo" -v "$env:JAVA_HOME`:C:\java:ro" -v "${node}:C:\node:ro" -v "${python}:C:\python:ro" -v bhash-debug-tools:C:\tools -v bhash-debug-gdb:C:\debugger -e JAVA_HOME=C:\java -e BHASH_NATIVE_TOOLCHAIN=managed -e BHASH_TOOLCHAIN_HOME=C:\tools -e BHASH_DEBUGGER_HOME=C:\debugger -e BHASH_TEST_PYTHON=C:\python\python.exe -e 'PATH=C:\java\bin;C:\node;C:\python;C:\Windows\system32;C:\Windows' mcr.microsoft.com/windows/servercore:ltsc2022 C:\node\node.exe scripts/test_windows_debug_clean.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Real VS Code Windows debugging with isolated development-tool PATH
        id: vscode
        continue-on-error: true
        shell: pwsh
        run: |
          $node=(Get-Command node.exe).Source
          $python=(Get-Command python.exe).Source
          $env:BHASH_TEST_PYTHON=$python
          $env:PATH="$env:JAVA_HOME\bin;$(Split-Path $node);$(Split-Path $python);$env:SystemRoot\system32;$env:SystemRoot"
          & $node editors/vscode/test/debug-run.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-debug-results
          path: |
            target/native-inspection/
            target/native-debugger/
            target/vscode-debug/dap.log
            target/bhash-vscode-*.vsix
      - name: Require clean-machine and actual editor debugger tests
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.clean.outcome }}' -ne 'success' -or '${{ steps.vscode.outcome }}' -ne 'success') { throw 'Windows debugger acceptance failed' }
