name: WebSocket server checks

on:
  pull_request:
    paths: &websocket-paths
      - 'src/main/resources/dev/bhash/stdlib/websocket.bhash'
      - 'src/main/resources/dev/bhash/stdlib/async-web.bhash'
      - 'src/main/resources/dev/bhash/stdlib/authentication.bhash'
      - 'src/main/resources/dev/bhash/stdlib/web.bhash'
      - 'src/main/java/dev/bhash/stdlib/StandardLibrary.java'
      - 'examples/websocket/**'
      - '.github/workflows/websocket.yml'
  push:
    branches: [main]
    paths: *websocket-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: websocket-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [jvm, clr, native]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-dotnet@v5
        if: matrix.target == 'clr'
        with:
          dotnet-version: '10.0.x'
      - name: Install the native toolchain
        if: matrix.target == 'native'
        run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18 build-essential binutils
      - name: Build the compiler
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Verify the transport contract and HTTP/1.1 wire protocol
        env:
          TARGET: ${{ matrix.target }}
          BHASH_GC_STRESS: ${{ matrix.target == 'native' && '1' || '0' }}
        run: |
          set -euo pipefail
          compiler=target/bhash-compiler-0.1.0-SNAPSHOT.jar
          for fixture in stream server; do
            source=examples/websocket/$fixture.bhash
            case "$TARGET" in
              jvm) output=target/websocket-$fixture.jar ;;
              clr) output=target/websocket-$fixture-clr ;;
              native) output=target/websocket-$fixture ;;
            esac
            java -jar "$compiler" compile "$source" --target "$TARGET" -o "$output"
            case "$TARGET" in
              jvm) command=(java -Dfile.encoding=UTF-8 -jar "$output") ;;
              clr) command=(dotnet "$output/BhashProgram.dll") ;;
              native) command=("$output") ;;
            esac
            if [[ $fixture == stream ]]; then
              "${command[@]}" | grep -Fx stream-ok
            else
              python3 examples/websocket/verify.py "${command[@]}"
            fi
          done
