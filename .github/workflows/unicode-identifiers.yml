name: Unicode identifier profile
on:
  push:
    paths: ['src/**', 'scripts/*unicode*', 'scripts/generate_identifier_profile.py', 'docs/identifier-profile*', '.github/workflows/unicode-identifiers.yml']
  pull_request:
    paths: ['src/**', 'scripts/*unicode*', 'scripts/generate_identifier_profile.py', 'docs/identifier-profile*', '.github/workflows/unicode-identifiers.yml']
permissions:
  contents: read
jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '26']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned Unicode data and generated profiles
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, urllib.request
          profile = json.loads(pathlib.Path('docs/identifier-profile.json').read_text())
          target = pathlib.Path('target/unicode-18-audit')
          target.mkdir(parents=True, exist_ok=True)
          for name, expected in profile['inputs'].items():
              with urllib.request.urlopen(profile['source'] + name, timeout=60) as response:
                  content = response.read().decode('utf-8-sig').replace('\r\n', '\n').encode('utf-8')
              assert hashlib.sha256(content).hexdigest() == expected, name
              (target / name).write_bytes(content)
          PY
          python scripts/generate_identifier_profile.py --data-dir target/unicode-18-audit --check
          python scripts/audit_unicode_identifiers.py --data-dir target/unicode-18-audit --output target/unicode-review.md
          python -c "from pathlib import Path; assert Path('docs/unicode-identifiers-repertoire-review.md').read_text(encoding='utf-8') == Path('target/unicode-review.md').read_text(encoding='utf-8')"
      - name: Check repertoire, normalization, diagnostics and editor ranges
        run: mvn --batch-mode --no-transfer-progress '-Dtest=FrontendTest,UnicodeIdentifiersTest,EditorAnalysisTest,ProjectLoaderTest#equivalentPhysicalSourceNamesAreRejectedBeforeResolution' test
