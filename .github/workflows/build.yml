name: Java compiler checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress verify
      - run: java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar check examples/hello.bhash
      - run: java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar check examples/factorial.bhash
      - run: python scripts/smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: bhash-jvm-${{ matrix.os }}
          path: |
            target/bhash-compiler-0.1.0-SNAPSHOT.jar
            target/factorial-console.jar
            examples/factorial-console.bhash
          if-no-files-found: error
