name: Bhash managed target checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      BHASH_REQUIRE_CLR: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: mvn --batch-mode --no-transfer-progress verify
      - run: java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar check examples/hello.bhash
      - run: java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar check examples/factorial.bhash
      - run: python scripts/smoke_test.py
      - run: python scripts/check_lessons.py --target jvm
      - run: python scripts/check_lessons.py --target clr
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tutorial/standard-library/verify.mjs --coverage-only
      - run: node tutorial/standard-library/verify.mjs --target jvm
      - run: node tutorial/standard-library/verify.mjs --target clr
      - uses: actions/upload-artifact@v4
        with:
          name: bhash-managed-${{ matrix.os }}
          path: |
            LICENSE
            NOTICE
            LICENSING.md
            THIRD_PARTY_NOTICES.md
            target/bhash-compiler-0.1.0-SNAPSHOT.jar
            target/collections.jar
            target/collections-clr/
            examples/collections/
            examples/exceptions.bhash
            examples/types/
            target/bitboards.jar
            target/bitboards-clr/
            examples/bitboards.bhash
            target/multi-file.jar
            target/multi-file-clr/
            examples/multi-file/
            target/factorial-console.jar
            target/factorial-clr/
            target/switch-console.jar
            target/switch-console-clr/
            examples/switch-console.bhash
            target/contracts-generics.jar
            target/contracts-generics-clr/
            examples/contracts-generics.bhash
            target/objects.jar
            target/objects-clr/
            target/factorial-objects.jar
            target/factorial-objects-clr/
            examples/factorial-console.bhash
            examples/objects.bhash
            examples/factorial-objects.bhash
          include-hidden-files: true
          if-no-files-found: error
