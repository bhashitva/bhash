name: Hindi book examples

on:
  pull_request:
    paths: &example-paths
      - 'book/examples/**'
      - 'scripts/check_book.py'
  push:
    branches: [main]
    paths: *example-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the compiler
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Compare JVM and CLR example output
        run: python scripts/check_book.py --target jvm --target clr
