name: Native diagnostic profiling (no optimization changes)
on:
  push:
    branches: ['profile/native-hotspots']
    paths: ['.github/workflows/native-profile.yml', 'benchmarks/profiling/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BHASH_NATIVE_TOOLCHAIN: system
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install profiling and native build tools
        run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18 build-essential binutils valgrind gdb linux-tools-common linux-tools-generic
      - name: Build unchanged compiler
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Profile unchanged release builds
        run: python3 benchmarks/profiling/profile_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-profiles-${{ github.run_id }}
          path: target/native-profiles/
          retention-days: 30
          if-no-files-found: error
