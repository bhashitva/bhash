name: Bhash managed native toolchain
on: [push, pull_request]
permissions:
  contents: read
jobs:
  managed-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test installer and build compiler
        run: mvn --batch-mode --no-transfer-progress -Dtest=ManagedToolchainTest,NativeReleaseTest package
      - uses: actions/cache@v4
        id: sdk-cache
        with:
          path: target/managed-toolchain
          key: linux-x64-bhash-sdk-v1-${{ hashFiles('scripts/native-toolchain.Dockerfile', 'scripts/build_native_toolchain.py', 'LICENSE', 'NOTICE') }}
      - name: Build portable toolchain from pinned Ubuntu snapshot
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          docker build -f scripts/native-toolchain.Dockerfile -t bhash-toolchain-builder .
          mkdir -p target/managed-toolchain
          docker run --rm -v "$PWD/target/managed-toolchain:/out" bhash-toolchain-builder
      - name: Verify HTTPS download and installation recovery
        run: python3 scripts/test_managed_toolchain_download.py
      - name: Build clean Java-only consumer image
        run: docker build -f scripts/native-toolchain-clean.Dockerfile -t bhash-toolchain-consumer .
      - name: Verify native compilation without system development packages
        run: |
          docker run --rm --network none -v "$PWD/target:/artifacts:ro" -v "$PWD:/repo:ro" bhash-toolchain-consumer sh /repo/scripts/test_managed_native.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bhash-managed-native-toolchain-linux-x86_64
          retention-days: 7
          compression-level: 0
          path: |
            target/managed-toolchain/
            target/bhash-compiler-0.1.0-SNAPSHOT.jar
            target/surefire-reports/
