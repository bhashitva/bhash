name: Bhash managed native toolchain
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: managed-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  managed-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test installer and build compiler
        run: mvn --batch-mode --no-transfer-progress -Dtest=ManagedToolchainTest,NativeReleaseTest package
      - name: Test SDK packager
        run: python3 -m unittest discover -s scripts -p "test_native_toolchain_builder.py"
      - uses: actions/cache/restore@v4
        id: sdk-cache
        with:
          path: target/managed-toolchain
          key: linux-x64-bhash-sdk-jammy-v1-${{ hashFiles('scripts/native-toolchain.Dockerfile', 'scripts/build_native_toolchain.py', 'LICENSE', 'NOTICE') }}
      - name: Build portable toolchain from pinned Ubuntu snapshot
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          docker build -f scripts/native-toolchain.Dockerfile -t bhash-toolchain-builder .
          mkdir -p target/managed-toolchain
          docker run --rm -v "$PWD/target/managed-toolchain:/out" bhash-toolchain-builder
      - name: Verify HTTPS download and installation recovery
        run: python3 scripts/test_managed_toolchain_download.py
      # The SDK is immutable and verified independently of the compiler consumer tests.
      - uses: actions/cache/save@v4
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        with:
          path: target/managed-toolchain
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
      - name: Verify clean Ubuntu 22.04 and 24.04 consumers
        run: |
          for version in 22.04 24.04; do
            docker build --build-arg UBUNTU_VERSION=$version -f scripts/native-toolchain-clean.Dockerfile -t bhash-toolchain-consumer:$version .
            docker run --rm --network none -v "$PWD/target:/artifacts:ro" -v "$PWD:/repo:ro" bhash-toolchain-consumer:$version sh /repo/scripts/test_managed_native.sh
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bhash-managed-native-toolchain-linux-x86_64
          retention-days: 7
          compression-level: 0
          path: |
            target/managed-toolchain/
            target/bhash-compiler-0.1.0-SNAPSHOT.jar
            target/surefire-reports/
