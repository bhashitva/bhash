name: Publish verified Windows native SDK
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful Windows native push run on main or feature/windows-native
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-windows-native-sdk-1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.source_run }}
    steps:
      - name: Verify successful build provenance
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > run.json
          python3 - <<'PY'
          import os,json,pathlib
          run=json.load(open('run.json'))
          assert run['conclusion']=='success' and run['event']=='push'
          assert run['path']=='.github/workflows/windows-native.yml'
          assert run['head_repository']['full_name']==os.environ['GH_REPO']
          assert run['head_branch'] in ('main','feature/windows-native')
          pathlib.Path('validated-head.txt').write_text(run['head_sha'])
          PY
      - name: Download tested SDK and verify immutable catalog hash
        run: |
          gh run download "$SOURCE_RUN" -n bhash-windows-native -D artifact
          cd artifact/windows-sdk
          echo 'b0d5934ea134e500ff598f737c40b3076400e85e5760a22bfcc28f7aaf321f3f  bhash-windows-x86_64-llvm18-v1.zip' | sha256sum -c -
      - name: Publish immutable Windows SDK assets
        run: |
          cat > notes.md <<'NOTES'
          Managed Windows 10+ x64 SDK for Bhash, using LLVM 18.1.8 and UCRT.

          The compiler requires Java 17+. No separate LLVM, Visual Studio, WSL or C development packages are required. Generated applications require neither Java nor .NET nor LLVM.

          The SDK includes LLVM and MinGW notices, the compiler wrapper source and license, and provenance recording the pinned official LLVM-MinGW upstream archive and source locations. Keep these notices with redistribution.

          Binary SHA-256: `b0d5934ea134e500ff598f737c40b3076400e85e5760a22bfcc28f7aaf321f3f`.

          The source build was checked for SDK reproducibility, native/JVM/CLR conformance, forced GC, clean Windows build/run, offline reuse, relocated debug releases, and application execution without development tools or Java mounted.
          NOTES
          BHASH_SDK_HEAD=$(cat validated-head.txt)
          gh release create native-sdk-windows-1.0.0 --draft --target "$BHASH_SDK_HEAD" --title 'Bhash Windows x64 native SDK 1.0.0 (LLVM 18)' --notes-file notes.md
          gh release upload native-sdk-windows-1.0.0 artifact/windows-sdk/bhash-windows-x86_64-llvm18-v1.zip artifact/windows-sdk/bhash-windows-x86_64-llvm18-v1.zip.sha256
          gh release edit native-sdk-windows-1.0.0 --draft=false --latest=false
