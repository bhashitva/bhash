name: Apply Windows native implementation
on:
  push:
    branches: [feature/windows-native]
    paths: [.github/workflows/apply-windows-native.yml]
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/windows-native
      - name: Apply source patch with context verification
        env:
          PAYLOAD: 
        run: |
          python3 - <<'PYTHON'
          import os,json,zlib,base64,pathlib,subprocess,re
          data=json.loads(zlib.decompress(base64.b64decode(os.environ['PAYLOAD'])))
          root=pathlib.Path.cwd().resolve()
          for name in data['new']:
              file=(root/name).resolve()
              assert file.is_relative_to(root) and '.git' not in file.relative_to(root).parts and not file.exists(),name
          restore=[]
          for name in re.findall(r'^--- a/(.+)$',data['patch'],re.M):
              file=root/name;original=file.read_bytes()
              if b'\r\n' in original:
                  restore.append(name);file.write_bytes(original.replace(b'\r\n',b'\n'))
          subprocess.run(['git','apply','--check','-'],input=data['patch'],text=True,check=True)
          subprocess.run(['git','apply','-'],input=data['patch'],text=True,check=True)
          for name in restore:
              file=root/name;file.write_bytes(file.read_bytes().replace(b'\n',b'\r\n'))
          for name,content in data['new'].items():
              file=root/name;file.parent.mkdir(parents=True,exist_ok=True);file.write_text(content,encoding='utf-8')
          PYTHON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Windows x64 native compilation and managed SDK setup'
          git push origin HEAD:feature/windows-native
      - name: Cancel superseded validation runs on this feature branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run list --branch feature/windows-native --limit 100 --json databaseId,status > runs.json
          python3 - <<'PYTHON' > superseded.txt
          import os,json
          for run in json.load(open('runs.json')):
              if str(run['databaseId'])!=os.environ['GITHUB_RUN_ID'] and run['status'] in ('queued','in_progress','waiting','pending','requested'):
                  print(run['databaseId'])
          PYTHON
          while read -r run; do gh run cancel "$run" || true; done < superseded.txt
