name: Apply Windows native implementation
on:
  push:
    branches: [feature/windows-native]
    paths: [.github/workflows/apply-windows-native.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/windows-native
      - name: Verify base files and apply implementation
        env:
          PAYLOAD_0: 
          PAYLOAD_1: 
          PAYLOAD_2: 
          PAYLOAD_3: 
          PAYLOAD_4: 
        run: |
          python3 - <<'PYTHON'
          import os,json,zlib,base64,hashlib,pathlib
          encoded=''.join(os.environ[k] for k in sorted(os.environ) if k.startswith('PAYLOAD_'))
          data=json.loads(zlib.decompress(base64.b64decode(encoded)))
          root=pathlib.Path.cwd().resolve()
          for name,expected in data['bases'].items():
              file=(root/name).resolve()
              assert file.is_relative_to(root) and '.git' not in file.relative_to(root).parts,name
              actual=hashlib.sha256(file.read_bytes()).hexdigest() if file.exists() else None
              assert actual==expected,('Base file changed; do not overwrite',name,actual,expected)
          for name,content in data['files'].items():
              file=root/name;file.parent.mkdir(parents=True,exist_ok=True);file.write_text(content,encoding='utf-8')
          (root/'.github/workflows/apply-windows-native.yml').unlink()
          PYTHON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Windows x64 native compilation and managed SDK setup'
          git push origin HEAD:feature/windows-native
