name: Bhash experimental native LLVM checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    env:
      BHASH_REQUIRE_NATIVE: 'true'
      BHASH_REQUIRE_CLR: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install LLVM 18 tools
        run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18 gdb build-essential binutils
      - name: Check collector under sanitizers and optimization
        run: |
          python3 scripts/test_native_runtime.py --sanitize
          python3 scripts/test_native_fixed.py
      - name: Build compiler for native checks
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Verify compiler archive reproducibility
        run: |
          sha256sum target/bhash-compiler-0.1.0-SNAPSHOT.jar > target/compiler.sha256
          mvn --batch-mode --no-transfer-progress -DskipTests package
          sha256sum -c target/compiler.sha256
      - name: Verify release reproducibility and compatibility
        run: python3 scripts/test_native_release.py
      - name: Verify source-level debugging with GDB
        run: python3 scripts/test_native_debugger.py
      - name: Verify and execute LLVM backend
        run: mvn --batch-mode --no-transfer-progress -Dtest=NativeBackendTest,NativeReleaseTest test
      - name: Verify standalone SQLite distribution and reproducibility
        run: python3 scripts/test_sqlite_distribution.py
      - name: Run Bhash foundation tests through the native CLI
        run: java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar test examples/foundations --target native
      - name: Build every applicable native example
        run: |
          python3 -m unittest discover -s scripts -p "test_build_examples.py"
          python3 scripts/build_examples.py --target native --require-native
      - name: Inspect executable dependencies
        run: |
          python3 - <<'PY' | tee target/native-dependencies.txt
          import json, pathlib, subprocess
          report = json.loads(pathlib.Path("target/examples/build-report.json").read_text(encoding="utf-8"))
          for entry in report["results"]:
              if entry["target"] == "native" and entry["status"] == "built":
                  executable = str(pathlib.Path(report["output_root"]) / entry["artifact"])
                  subprocess.run(["file", executable], check=True)
                  subprocess.run(["ldd", executable], check=True)
          PY
          if grep -Ei 'jvm|libjli|coreclr|hostfxr|mono' target/native-dependencies.txt; then exit 1; fi
      - name: Run in clean deployment environment
        run: |
          docker run --rm --network none -v "$PWD/target:/artifacts:ro" ubuntu:24.04 sh -eu -c '
            for tool in java dotnet clang gcc; do
              if command -v "$tool"; then echo "Unexpected development/runtime tool: $tool"; exit 1; fi
            done
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/examples/native/sqlite/offline.test > /tmp/sqlite-actual 2> /tmp/sqlite-stats
            test ! -s /tmp/sqlite-actual
            grep "live=0" /tmp/sqlite-stats
            cd /tmp
            tar -xzf /artifacts/native-release/hello-1.0.0-linux-x86_64.tar.gz
            cd /tmp/hello-1.0.0-linux-x86_64
            sha256sum -c SHA256SUMS
            ./check-host.sh
            ./run.sh > /tmp/release-actual
            printf "नमस्ते 😀\n" > /tmp/release-expected
            cmp /tmp/release-actual /tmp/release-expected
            cd /tmp
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/examples/native/native/generics > /tmp/generics-actual 2> /tmp/generics-stats
            printf "५०० १२४७५० ५०० सत्य\n" > /tmp/generics-expected
            cmp /tmp/generics-actual /tmp/generics-expected
            grep "live=0" /tmp/generics-stats
            grep -E "allocations=[1-9][0-9]* collections=[1-9][0-9]*" /tmp/generics-stats
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/examples/native/native/records > /tmp/records-actual 2> /tmp/records-stats
            printf "१००० ४९९५०० १००० सत्य\n" > /tmp/records-expected
            cmp /tmp/records-actual /tmp/records-expected
            grep "live=0" /tmp/records-stats
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/examples/native/native/enums > /tmp/enums-actual 2> /tmp/enums-stats
            printf "१००० १००० हरा सत्य\n" > /tmp/enums-expected
            cmp /tmp/enums-actual /tmp/enums-expected
            grep "live=0" /tmp/enums-stats
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/examples/native/native/static-members > /tmp/static-actual 2> /tmp/static-stats
            printf "१००० ९९९ वस्तु999 😀999\nरिक्त\n" > /tmp/static-expected
            cmp /tmp/static-actual /tmp/static-expected
            grep "live=0" /tmp/static-stats
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/examples/native/native/int32 > /tmp/int32-actual 2> /tmp/int32-stats
            printf "३०० ० २९९ -१५० १४९\n४९९५०० १००० क299\n" > /tmp/int32-expected
            cmp /tmp/int32-actual /tmp/int32-expected
            grep "live=0" /tmp/int32-stats
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/examples/native/native/bitwise-selection > /tmp/control-actual 2> /tmp/control-stats
            printf "१ -१ १ -१\n६६७ ३३३\nअंतिम😀\n" > /tmp/control-expected
            cmp /tmp/control-actual /tmp/control-expected
            grep "live=0" /tmp/control-stats
            printf "भारत😀\n+४२\n" > /tmp/console-input
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/examples/native/native/console < /tmp/console-input > /tmp/console-actual 2> /tmp/console-stats
            printf "अपना नाम लिखें:\nएक पूर्णांक लिखें:\nनमस्ते भारत😀 ४२\n" > /tmp/console-expected
            cmp /tmp/console-actual /tmp/console-expected
            grep "live=0" /tmp/console-stats
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/examples/native/native/time > /tmp/time-actual 2> /tmp/time-stats
            printf "1969-12-31T23:59:59.999Z\n२००० २ २९\nसत्य\n१००० १०००\nसमय सीमा से बाहर है।\n" > /tmp/time-expected
            cmp /tmp/time-actual /tmp/time-expected
            grep "live=0" /tmp/time-stats
            mkdir -p target/native-byte-example
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/examples/native/native/bytes > /tmp/bytes-actual 2> /tmp/bytes-stats
            printf "अमान्य UTF-8 बाइटबफ़र।\n३०० ३३५८६\n२५५ २५५ -१\n" > /tmp/bytes-expected
            cmp /tmp/bytes-actual /tmp/bytes-expected
            grep "live=0" /tmp/bytes-stats
            mkdir -p target/native-file-example
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/examples/native/native/files > /tmp/files-actual 2> /tmp/files-stats
            printf "सत्य\n४९५० सत्य\nफ़ाइल पढ़ी नहीं जा सकी।\nबचा😀\n" > /tmp/files-expected
            cmp /tmp/files-actual /tmp/files-expected
            grep "live=0" /tmp/files-stats
            /artifacts/examples/native/native/hello > /tmp/hello-actual
            printf "नमस्ते, दुनिया!\n१\nबीच ४\n९\n" > /tmp/hello-expected
            cmp /tmp/hello-actual /tmp/hello-expected
            /artifacts/examples/native/factorial > /tmp/actual
            printf "१ १\n२ २\n३ ६\n४ २४\n५ १२०\n" > /tmp/expected
            cmp /tmp/actual /tmp/expected
            /artifacts/examples/native/factorial --bhash-license | grep "Apache License"
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/examples/native/native/heap-text > /tmp/text-actual 2> /tmp/gc-stats
            printf "[[[मूल321]]]\nनमस्ते, दुनिया!\nभाष-ब-भाष\n२ सत्य\nसत्य सत्य\nabcÉ ककक\nv१२३ -४२\n३००००\n" > /tmp/text-expected
            cmp /tmp/text-actual /tmp/text-expected
            grep "live=0" /tmp/gc-stats
            grep -E "allocations=[1-9][0-9]* collections=[1-9][0-9]*" /tmp/gc-stats
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/examples/native/native/heap-objects > /tmp/objects-actual 2> /tmp/objects-stats
            printf "कड़ी22 सत्य सत्य\nकड़ी2 १ सत्य\nसत्य\n" > /tmp/objects-expected
            cmp /tmp/objects-actual /tmp/objects-expected
            grep "live=0" /tmp/objects-stats
            grep -E "allocations=[1-9][0-9]* collections=[1-9][0-9]*" /tmp/objects-stats
            /artifacts/examples/native/objects > /tmp/bank-actual
            printf "मनोज १५० १५ १६५\n" > /tmp/bank-expected
            cmp /tmp/bank-actual /tmp/bank-expected
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/examples/native/native/inheritance > /tmp/inheritance-actual 2> /tmp/inheritance-stats
            printf "मूल😀:आधार:विशेष!\nसाथी:आधार:ख! सत्य\nमूल😀:आधार:विशेष! साथी:आधार:ख!\n" > /tmp/inheritance-expected
            cmp /tmp/inheritance-actual /tmp/inheritance-expected
            grep "live=0" /tmp/inheritance-stats
            grep -E "allocations=[1-9][0-9]* collections=[1-9][0-9]*" /tmp/inheritance-stats
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/examples/native/native/interfaces > /tmp/interfaces-actual 2> /tmp/interfaces-stats
            printf "[मूल😀:विशेष!] साथी:ख! सत्य\nसत्य सत्य सत्य सत्य\n[मूल😀:विशेष!] साथी:ख!\n" > /tmp/interfaces-expected
            cmp /tmp/interfaces-actual /tmp/interfaces-expected
            grep "live=0" /tmp/interfaces-stats
            grep -E "allocations=[1-9][0-9]* collections=[1-9][0-9]*" /tmp/interfaces-stats
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/examples/native/native/boxing > /tmp/boxing-actual 2> /tmp/boxing-stats
            printf "४२ सत्य मूल😀 सत्य\nमूल😀 सत्य २९९९\n" > /tmp/boxing-expected
            cmp /tmp/boxing-actual /tmp/boxing-expected
            grep "live=0" /tmp/boxing-stats
            grep -E "allocations=[1-9][0-9]* collections=[1-9][0-9]*" /tmp/boxing-stats
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/examples/native/native/collections > /tmp/collections-actual 2> /tmp/collections-stats
            printf "३०० ३०० श299 २९९\nश0 श299 सत्य\nसत्य सत्य\n" > /tmp/collections-expected
            cmp /tmp/collections-actual /tmp/collections-expected
            grep "live=0" /tmp/collections-stats
            grep -E "allocations=[1-9][0-9]* collections=[1-9][0-9]*" /tmp/collections-stats
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/examples/native/native/exceptions > /tmp/exceptions-actual 2> /tmp/exceptions-stats
            printf "१२४७५० ५००\nबचा😀\n" > /tmp/exceptions-expected
            cmp /tmp/exceptions-actual /tmp/exceptions-expected
            grep "live=0" /tmp/exceptions-stats
            grep -E "allocations=[1-9][0-9]* collections=[1-9][0-9]*" /tmp/exceptions-stats
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/examples/native/native/decimals > /tmp/decimals-actual 2> /tmp/decimals-stats
            printf "23.94\n१००० १२४.८७५ १ एक ही कुंजी\nसंख्यात्मक परिवर्तन सीमा से बाहर है।\n-०.० NaN Infinity\n" > /tmp/decimals-expected
            cmp /tmp/decimals-actual /tmp/decimals-expected
            grep "live=0" /tmp/decimals-stats
            grep -E "allocations=[1-9][0-9]* collections=[1-9][0-9]*" /tmp/decimals-stats
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/examples/native/native/math-random > /tmp/math-random-actual 2> /tmp/math-random-stats
            printf "४२ ३ ८\n९.० १०२४.० -३.० -२.०\n२.० ४.० ०.०\n1.000000 -1.000000\n0.693147 2.718282\n१००० ७.४ २.४ -४०५८\nएक सीमित दशमलव मान आवश्यक है।\nसाफ\n६\n" > /tmp/math-random-expected
            cmp /tmp/math-random-actual /tmp/math-random-expected
            grep "live=0" /tmp/math-random-stats
            grep -E "allocations=[1-9][0-9]* collections=[1-9][0-9]*" /tmp/math-random-stats
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/examples/native/native/json-text > /tmp/json-text-actual 2> /tmp/json-text-stats
            printf "४ अ||भारत😀|\n४४८५० ३००\n{\"नाम\":\"भारत😀\",\"अंक\":[1,2]}\n[[\"साझा\",1.0],[\"साझा\",1.0]]\nचक्रीय संग्रह को जेसन में नहीं लिख सकते।\n" > /tmp/json-text-expected
            cmp /tmp/json-text-actual /tmp/json-text-expected
            grep "live=0" /tmp/json-text-stats
            grep -E "allocations=[1-9][0-9]* collections=[1-9][0-9]*" /tmp/json-text-stats
          '
      - uses: actions/upload-artifact@v4
        with:
          name: bhash-experimental-native-linux-x86_64
          path: |
            target/examples/
            target/native-debugger/
            target/native-dependencies.txt
            target/native-tests/factorial.ll
            target/surefire-reports/
            docs/native-compilation-design.md
            docs/native-text.md
            docs/native-objects.md
            docs/native-inheritance.md
            docs/native-interfaces.md
            docs/native-boxing.md
            docs/native-collections.md
            docs/native-exceptions.md
            docs/native-decimals.md
            docs/native-math-random.md
            docs/native-json-text.md
            docs/native-files.md
            docs/native-bytes.md
            docs/native-time.md
            docs/native-console.md
            docs/native-control-flow.md
            docs/native-int32.md
            docs/native-static-members.md
            docs/native-enums.md
            docs/native-records.md
            docs/native-generics.md
            docs/native-diagnostics.md
            docs/native-releases.md
