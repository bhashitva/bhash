name: Bhash experimental native LLVM checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    env:
      BHASH_REQUIRE_NATIVE: 'true'
      BHASH_REQUIRE_CLR: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install LLVM 18 tools
        run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18
      - name: Check collector under sanitizers and optimization
        run: python3 scripts/test_native_runtime.py --sanitize
      - name: Verify and execute LLVM backend
        run: mvn --batch-mode --no-transfer-progress -Dtest=NativeBackendTest package
      - name: Build independent example
        run: |
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar compile examples/factorial.bhash --target native -o target/factorial-native
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar compile examples/native/heap-text.bhash --target native -o target/heap-text-native
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar compile examples/native/heap-objects.bhash --target native -o target/heap-objects-native
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar compile examples/objects.bhash --target native -o target/objects-native
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar compile examples/native/inheritance.bhash --target native -o target/inheritance-native
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar compile examples/native/interfaces.bhash --target native -o target/interfaces-native
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar compile examples/native/boxing.bhash --target native -o target/boxing-native
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar compile examples/native/collections.bhash --target native -o target/collections-native
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar compile examples/native/exceptions.bhash --target native -o target/exceptions-native
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar compile examples/native/decimals.bhash --target native -o target/decimals-native
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar compile examples/native/math-random.bhash --target native -o target/math-random-native
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar compile examples/native/json-text.bhash --target native -o target/json-text-native
      - name: Inspect executable dependencies
        run: |
          for executable in target/factorial-native target/heap-text-native target/heap-objects-native target/objects-native target/inheritance-native target/interfaces-native target/boxing-native target/collections-native target/exceptions-native target/decimals-native target/math-random-native target/json-text-native; do
            file "$executable"
            ldd "$executable"
          done | tee target/native-dependencies.txt
          if grep -Ei 'jvm|libjli|coreclr|hostfxr|mono' target/native-dependencies.txt; then exit 1; fi
      - name: Run in clean deployment environment
        run: |
          docker run --rm --network none -v "$PWD/target:/artifacts:ro" ubuntu:24.04 sh -eu -c '
            for tool in java dotnet clang gcc; do
              if command -v "$tool"; then echo "Unexpected development/runtime tool: $tool"; exit 1; fi
            done
            /artifacts/factorial-native > /tmp/actual
            printf "१ १\n२ २\n३ ६\n४ २४\n५ १२०\n" > /tmp/expected
            cmp /tmp/actual /tmp/expected
            /artifacts/factorial-native --bhash-license | grep "Apache License"
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/heap-text-native > /tmp/text-actual 2> /tmp/gc-stats
            printf "[[[मूल321]]]\nनमस्ते, दुनिया!\nभाष-ब-भाष\n२ सत्य\nसत्य सत्य\nabcÉ ककक\nv१२३ -४२\n३००००\n" > /tmp/text-expected
            cmp /tmp/text-actual /tmp/text-expected
            grep "live=0" /tmp/gc-stats
            grep -E "allocations=[1-9][0-9]* collections=[1-9][0-9]*" /tmp/gc-stats
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/heap-objects-native > /tmp/objects-actual 2> /tmp/objects-stats
            printf "कड़ी22 सत्य सत्य\nकड़ी2 १ सत्य\nसत्य\n" > /tmp/objects-expected
            cmp /tmp/objects-actual /tmp/objects-expected
            grep "live=0" /tmp/objects-stats
            grep -E "allocations=[1-9][0-9]* collections=[1-9][0-9]*" /tmp/objects-stats
            /artifacts/objects-native > /tmp/bank-actual
            printf "मनोज १५० १५ १६५\n" > /tmp/bank-expected
            cmp /tmp/bank-actual /tmp/bank-expected
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/inheritance-native > /tmp/inheritance-actual 2> /tmp/inheritance-stats
            printf "मूल😀:आधार:विशेष!\nसाथी:आधार:ख! सत्य\nमूल😀:आधार:विशेष! साथी:आधार:ख!\n" > /tmp/inheritance-expected
            cmp /tmp/inheritance-actual /tmp/inheritance-expected
            grep "live=0" /tmp/inheritance-stats
            grep -E "allocations=[1-9][0-9]* collections=[1-9][0-9]*" /tmp/inheritance-stats
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/interfaces-native > /tmp/interfaces-actual 2> /tmp/interfaces-stats
            printf "[मूल😀:विशेष!] साथी:ख! सत्य\nसत्य सत्य सत्य सत्य\n[मूल😀:विशेष!] साथी:ख!\n" > /tmp/interfaces-expected
            cmp /tmp/interfaces-actual /tmp/interfaces-expected
            grep "live=0" /tmp/interfaces-stats
            grep -E "allocations=[1-9][0-9]* collections=[1-9][0-9]*" /tmp/interfaces-stats
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/boxing-native > /tmp/boxing-actual 2> /tmp/boxing-stats
            printf "४२ सत्य मूल😀 सत्य\nमूल😀 सत्य २९९९\n" > /tmp/boxing-expected
            cmp /tmp/boxing-actual /tmp/boxing-expected
            grep "live=0" /tmp/boxing-stats
            grep -E "allocations=[1-9][0-9]* collections=[1-9][0-9]*" /tmp/boxing-stats
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/collections-native > /tmp/collections-actual 2> /tmp/collections-stats
            printf "३०० ३०० श299 २९९\nश0 श299 सत्य\nसत्य सत्य\n" > /tmp/collections-expected
            cmp /tmp/collections-actual /tmp/collections-expected
            grep "live=0" /tmp/collections-stats
            grep -E "allocations=[1-9][0-9]* collections=[1-9][0-9]*" /tmp/collections-stats
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/exceptions-native > /tmp/exceptions-actual 2> /tmp/exceptions-stats
            printf "१२४७५० ५००\nबचा😀\n" > /tmp/exceptions-expected
            cmp /tmp/exceptions-actual /tmp/exceptions-expected
            grep "live=0" /tmp/exceptions-stats
            grep -E "allocations=[1-9][0-9]* collections=[1-9][0-9]*" /tmp/exceptions-stats
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/decimals-native > /tmp/decimals-actual 2> /tmp/decimals-stats
            printf "23.94\n१००० १२४.८७५ १ एक ही कुंजी\nसंख्यात्मक परिवर्तन सीमा से बाहर है।\n-०.० NaN Infinity\n" > /tmp/decimals-expected
            cmp /tmp/decimals-actual /tmp/decimals-expected
            grep "live=0" /tmp/decimals-stats
            grep -E "allocations=[1-9][0-9]* collections=[1-9][0-9]*" /tmp/decimals-stats
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/math-random-native > /tmp/math-random-actual 2> /tmp/math-random-stats
            printf "४२ ३ ८\n९.० १०२४.० -३.० -२.०\n२.० ४.० ०.०\n1.000000 -1.000000\n0.693147 2.718282\n१००० ७.४ २.४ -४०५८\nएक सीमित दशमलव मान आवश्यक है।\nसाफ\n६\n" > /tmp/math-random-expected
            cmp /tmp/math-random-actual /tmp/math-random-expected
            grep "live=0" /tmp/math-random-stats
            grep -E "allocations=[1-9][0-9]* collections=[1-9][0-9]*" /tmp/math-random-stats
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/json-text-native > /tmp/json-text-actual 2> /tmp/json-text-stats
            printf "४ अ||भारत😀|\n४४८५० ३००\n[[\"साझा\",1.0],[\"साझा\",1.0]]\nचक्रीय संग्रह को जेसन में नहीं लिख सकते।\n" > /tmp/json-text-expected
            cmp /tmp/json-text-actual /tmp/json-text-expected
            grep "live=0" /tmp/json-text-stats
            grep -E "allocations=[1-9][0-9]* collections=[1-9][0-9]*" /tmp/json-text-stats
          '
      - uses: actions/upload-artifact@v4
        with:
          name: bhash-experimental-native-linux-x86_64
          path: |
            target/factorial-native
            target/objects-native
            target/exceptions-native
            target/decimals-native
            target/math-random-native
            target/json-text-native
            target/collections-native
            target/boxing-native
            target/interfaces-native
            target/inheritance-native
            target/heap-objects-native
            target/heap-text-native
            target/native-dependencies.txt
            target/native-tests/factorial.ll
            target/surefire-reports/
            docs/native-compilation-design.md
            docs/native-text.md
            docs/native-objects.md
            docs/native-inheritance.md
            docs/native-interfaces.md
            docs/native-boxing.md
            docs/native-collections.md
            docs/native-exceptions.md
            docs/native-decimals.md
            docs/native-math-random.md
            docs/native-json-text.md
