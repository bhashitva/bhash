name: Bhash experimental native LLVM checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    env:
      BHASH_REQUIRE_NATIVE: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install LLVM 18 tools
        run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18
      - name: Check collector under sanitizers and optimization
        run: python3 scripts/test_native_runtime.py --sanitize
      - name: Verify and execute LLVM backend
        run: mvn --batch-mode --no-transfer-progress -Dtest=NativeBackendTest package
      - name: Build independent example
        run: |
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar compile examples/factorial.bhash --target native -o target/factorial-native
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar compile examples/native/heap-text.bhash --target native -o target/heap-text-native
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar compile examples/native/heap-objects.bhash --target native -o target/heap-objects-native
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar compile examples/objects.bhash --target native -o target/objects-native
          java -jar target/bhash-compiler-0.1.0-SNAPSHOT.jar compile examples/native/inheritance.bhash --target native -o target/inheritance-native
      - name: Inspect executable dependencies
        run: |
          for executable in target/factorial-native target/heap-text-native target/heap-objects-native target/objects-native target/inheritance-native; do
            file "$executable"
            ldd "$executable"
          done | tee target/native-dependencies.txt
          if grep -Ei 'jvm|libjli|coreclr|hostfxr|mono' target/native-dependencies.txt; then exit 1; fi
      - name: Run in clean deployment environment
        run: |
          docker run --rm --network none -v "$PWD/target:/artifacts:ro" ubuntu:24.04 sh -eu -c '
            for tool in java dotnet clang gcc; do
              if command -v "$tool"; then echo "Unexpected development/runtime tool: $tool"; exit 1; fi
            done
            /artifacts/factorial-native > /tmp/actual
            printf "१ १\n२ २\n३ ६\n४ २४\n५ १२०\n" > /tmp/expected
            cmp /tmp/actual /tmp/expected
            /artifacts/factorial-native --bhash-license | grep "Apache License"
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/heap-text-native > /tmp/text-actual 2> /tmp/gc-stats
            printf "[[[मूल321]]]\nनमस्ते, दुनिया!\nभाष-ब-भाष\n२ सत्य\nसत्य सत्य\nabcÉ ककक\nv१२३ -४२\n३००००\n" > /tmp/text-expected
            cmp /tmp/text-actual /tmp/text-expected
            grep "live=0" /tmp/gc-stats
            grep -E "allocations=[1-9][0-9]* collections=[1-9][0-9]*" /tmp/gc-stats
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/heap-objects-native > /tmp/objects-actual 2> /tmp/objects-stats
            printf "कड़ी22 सत्य सत्य\nकड़ी2 १ सत्य\nसत्य\n" > /tmp/objects-expected
            cmp /tmp/objects-actual /tmp/objects-expected
            grep "live=0" /tmp/objects-stats
            grep -E "allocations=[1-9][0-9]* collections=[1-9][0-9]*" /tmp/objects-stats
            /artifacts/objects-native > /tmp/bank-actual
            printf "मनोज १५० १५ १६५\n" > /tmp/bank-expected
            cmp /tmp/bank-actual /tmp/bank-expected
            BHASH_GC_STRESS=1 BHASH_GC_STATS=1 /artifacts/inheritance-native > /tmp/inheritance-actual 2> /tmp/inheritance-stats
            printf "मूल😀:आधार:विशेष!\nसाथी:आधार:ख! सत्य\nमूल😀:आधार:विशेष! साथी:आधार:ख!\n" > /tmp/inheritance-expected
            cmp /tmp/inheritance-actual /tmp/inheritance-expected
            grep "live=0" /tmp/inheritance-stats
            grep -E "allocations=[1-9][0-9]* collections=[1-9][0-9]*" /tmp/inheritance-stats
          '
      - uses: actions/upload-artifact@v4
        with:
          name: bhash-experimental-native-linux-x86_64
          path: |
            target/factorial-native
            target/objects-native
            target/inheritance-native
            target/heap-objects-native
            target/heap-text-native
            target/native-dependencies.txt
            target/native-tests/factorial.ll
            target/surefire-reports/
            docs/native-compilation-design.md
            docs/native-text.md
            docs/native-objects.md
            docs/native-inheritance.md
