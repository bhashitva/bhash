name: Bhash Jupyter kernel
on:
  pull_request:
    paths: &ci-paths
      - 'src/main/**'
      - 'pom.xml'
      - 'docs/identifier-profile.json'
      - 'docs/identifier-profile-baseline.g4'
      - 'editors/jupyter/**'
      - 'scripts/package_jupyter.py'
      - 'scripts/build_jupyter_lookup.py'
      - 'scripts/test_jupyter_lookup.cjs'
      - 'scripts/check_jupyter_package.py'
      - '.github/actions/build-jupyter-ui/**'
      - 'playground/src/library*.mjs'
      - 'playground/src/identifier-profile.js'
      - 'playground/public/library.json'
      - 'playground/public/index.html'
      - 'playground/public/style.css'
      - 'src/test/resources/mysql/**'
      - 'src/test/resources/sqlserver/**'
      - '.github/workflows/jupyter.yml'
      - '!**/*.md'
  push:
    branches: [main]
    paths: *ci-paths
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lookup:
    strategy:
      fail-fast: false
      matrix:
        frontend: [lab, notebook]
        profile: [current, minimum]
        include:
          - profile: current
            lab-version: '4.6.6'
            notebook-version: '7.6.5'
          - profile: minimum
            lab-version: '4.2.7'
            notebook-version: '7.2.3'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/build-jupyter-ui
      - run: python -m pip install build
      - name: Use the verified compiler for installed-wheel UI tests
        shell: bash
        run: |
          mkdir -p target
          curl --fail --location --retry 3 'https://github.com/bhashitva/bhash/releases/download/bhash-0.28.0/bhash-compiler-0.28.0.jar' -o target/bhash-compiler-0.1.0-SNAPSHOT.jar
          echo '8fbcef3abb5a56f0a13d41c0d66cdcae00dfc2656f481f578d97d82cd0863fd0  target/bhash-compiler-0.1.0-SNAPSHOT.jar' | sha256sum -c -
      - run: python scripts/package_jupyter.py
      - run: python -m pip install target/jupyter-dist/*.whl 'jupyterlab==${{ matrix.lab-version }}' 'notebook==${{ matrix.notebook-version }}'
      - name: Verify the wheel contains a portable prebuilt extension
        run: python scripts/check_jupyter_package.py
      - name: Install the pinned browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Record Notebook's upstream startup baseline with the lookup disabled
        if: matrix.frontend == 'notebook'
        run: node scripts/test_jupyter_lookup.cjs notebook --baseline
      - run: node scripts/test_jupyter_lookup.cjs ${{ matrix.frontend }}
      - uses: actions/upload-artifact@v4
        if: matrix.frontend == 'lab' && matrix.profile == 'current'
        with:
          name: bhash-jupyter-library-preview
          path: |
            target/jupyter-dist/*.whl
            target/jupyter-dist/*.whl.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jupyter-lookup-${{ matrix.frontend }}-${{ matrix.profile }}
          path: |
            target/jupyter-lookup-${{ matrix.frontend }}/*.png
            target/jupyter-lookup-${{ matrix.frontend }}/server.log
            target/jupyter-lookup-${{ matrix.frontend }}/*.json
            target/jupyter-lookup-notebook-baseline/*.json
            target/jupyter-lookup-notebook-baseline/*.png
            target/jupyter-lookup-notebook-baseline/server.log
          if-no-files-found: warn
  kernel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mvn --batch-mode --no-transfer-progress package -DskipTests
      - uses: ./.github/actions/build-jupyter-ui
      - run: python -m pip install ./editors/jupyter
      - run: python editors/jupyter/test_kernel.py target/bhash-compiler-0.1.0-SNAPSHOT.jar --notebook editors/jupyter/पहली-नोटबुक.ipynb

  mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: bhash
          MYSQL_USER: bhash
          MYSQL_PASSWORD: ci-user-only
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      JUPYTER_DATA_DIR: ${{ github.workspace }}/target/jupyter-user
      BHASH_MYSQL_PASSWORD: ci-user-only
      BHASH_MYSQL_TLS: disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mvn --batch-mode --no-transfer-progress package -DskipTests
      - uses: ./.github/actions/build-jupyter-ui
      - run: mvn --batch-mode --no-transfer-progress org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy -Dartifact=com.mysql:mysql-connector-j:9.3.0 -DoutputDirectory=target/mysql-driver
      - name: Package and install the wheel
        run: |
          python -m pip install build
          python scripts/package_jupyter.py
          python -m pip install target/jupyter-dist/*.whl
          python -m bhash_jupyter.install --mysql-driver "target/mysql-driver/mysql-connector-j-9.3.0.jar" --notebook target/jupyter-dist/hindi-starter.ipynb
      - name: Run Jupyter cells against MySQL 8.4
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          docker exec -e MYSQL_PWD="$BHASH_MYSQL_PASSWORD" "$MYSQL_CONTAINER" \
            mysql -h127.0.0.1 -ubhash bhash -e 'CREATE TABLE items (id BIGINT PRIMARY KEY, body VARCHAR(200) CHARACTER SET utf8mb4, payload VARBINARY(32), extra INT NULL) ENGINE=InnoDB'
          python editors/jupyter/test_kernel.py --installed --notebook target/jupyter-dist/hindi-starter.ipynb --mysql
      - name: Save tested release files
        run: |
          cd target/jupyter-dist
          sha256sum *.whl hindi-starter.ipynb > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: jupyter-mysql-wheel
          path: target/jupyter-dist/

  sqlserver:
    needs: mysql
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'BhashCi-Only2026!'
        ports: ['1433:1433']
    env:
      JUPYTER_DATA_DIR: ${{ github.workspace }}/target/jupyter-user
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: jupyter-mysql-wheel
          path: target/jupyter-dist
      - name: Install the tested wheel and register both JDBC drivers
        run: |
          (cd target/jupyter-dist && sha256sum -c SHA256SUMS)
          mvn --batch-mode --no-transfer-progress org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy \
            -Dartifact=com.microsoft.sqlserver:mssql-jdbc:12.10.2.jre11 '-DoutputDirectory=target/jdbc drivers'
          mvn --batch-mode --no-transfer-progress org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy \
            -Dartifact=com.mysql:mysql-connector-j:9.3.0 '-DoutputDirectory=target/jdbc drivers'
          python -m pip install target/jupyter-dist/*.whl
          python -m bhash_jupyter.install \
            --sqlserver-driver "target/jdbc drivers/mssql-jdbc-12.10.2.jre11.jar" \
            --mysql-driver "target/jdbc drivers/mysql-connector-j-9.3.0.jar"
      - name: Test parameter binding and rollback in Jupyter against SQL Server 2022
        env:
          SQLSERVER_CONTAINER: ${{ job.services.sqlserver.id }}
          SQLCMDPASSWORD: 'BhashCi-Only2026!'
        run: |
          sqlcmd=(docker exec -e SQLCMDPASSWORD "$SQLSERVER_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -b)
          for attempt in {1..24}; do
            if "${sqlcmd[@]}" -Q 'SELECT 1' >/dev/null 2>&1; then break; fi
            if [[ "$attempt" == 24 ]]; then docker logs "$SQLSERVER_CONTAINER"; exit 1; fi
            sleep 3
          done
          docker cp src/test/resources/sqlserver/schema.sql "$SQLSERVER_CONTAINER:/tmp/bhash-schema.sql"
          "${sqlcmd[@]}" -i /tmp/bhash-schema.sql
          export BHASH_SQLSERVER_URL="jdbc:sqlserver://127.0.0.1:1433;databaseName=bhash;user=sa;password=$SQLCMDPASSWORD;encrypt=true;trustServerCertificate=true"
          python editors/jupyter/test_kernel.py --installed --notebook target/jupyter-dist/hindi-starter.ipynb --sqlserver
