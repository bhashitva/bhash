name: Bhash browser WebAssembly checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet workload install wasm-tools
      - run: mvn --batch-mode --no-transfer-progress package -DskipTests
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser_smoke_test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bhash-browser-wasm
          path: |
            target/bhash-compiler-0.1.0-SNAPSHOT.jar
            target/browser-tests/
            target/browser-tests.png
          include-hidden-files: true
          if-no-files-found: error
