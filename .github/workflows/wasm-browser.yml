name: Bhash browser WebAssembly checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet workload install wasm-tools
      - run: mvn --batch-mode --no-transfer-progress package -DskipTests
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm ci --prefix playground --no-audit --no-fund
      - run: npm run build --prefix playground
      - name: Profile full publishing before preparing the reusable browser host
        run: python3 scripts/profile_browser_publish.py
      - name: Compare Run to first output on the same host
        timeout-minutes: 6
        run: node scripts/playground_performance.cjs
      - name: Produce the before and after comparison report
        run: python3 scripts/analyze_playground_performance.py
      - name: Validate all existing browser semantics through the prebuilt host
        run: node scripts/browser_smoke_test.cjs
        env:
          BHASH_BROWSER_HOST: ${{ github.workspace }}/target/browser-publish-profile/host
      - name: Validate original standalone browser publishing
        run: node scripts/browser_smoke_test.cjs
      - run: node scripts/playground_smoke_test.cjs
        env:
          BHASH_BROWSER_HOST: ${{ github.workspace }}/target/browser-publish-profile/host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bhash-browser-wasm
          path: |
            LICENSE
            NOTICE
            LICENSING.md
            THIRD_PARTY_NOTICES.md
            target/bhash-compiler-0.1.0-SNAPSHOT.jar
            target/browser-tests/
            target/browser-tests.png
            target/browser-factorial.png
            target/playground-desktop.png
            target/playground-mobile.png
            target/browser-publish-profile/results.json
            target/browser-publish-profile/*/*.log
            target/browser-publish-profile/*/*phases.json
            target/playground-performance/
          include-hidden-files: true
          if-no-files-found: error
